<div id="orderForm" class="order-form-container" style="display: none;">
    <div class="order-form-overlay" onclick="hideOrderForm()"></div>
    <div class="order-form-content">
        <div class="order-form-header">
            <h2>Passer une commande</h2>
            <button class="close-btn" onclick="hideOrderForm()">&times;</button>
        </div>
        <form id="orderFormElement" onsubmit="handleOrderSubmit(event)">
            <div class="form-group">
                <label for="customerName">Nom du client *</label>
                <input type="text" id="customerName" name="customerName" required>
            </div>
            
            <div class="form-group">
                <label for="customerPhone">Numéro de téléphone *</label>
                <input type="tel" id="customerPhone" name="customerPhone" required>
            </div>
            
            <div class="form-group">
                <label for="selectedDish">Plat choisi</label>
                <input type="text" id="selectedDish" name="selectedDish" readonly>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantité *</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1" required>
            </div>
            
            <div class="form-group">
                <label for="deliveryLocation">Lieu de livraison *</label>
                <input type="text" id="deliveryLocation" name="deliveryLocation" required>
            </div>
            
            <div class="form-group">
                <label for="deliveryTime">Heure de livraison *</label>
                <input type="time" id="deliveryTime" name="deliveryTime" required>
            </div>
            
            <div class="form-group">
                <label for="additionalMessage">Message supplémentaire</label>
                <textarea id="additionalMessage" name="additionalMessage" rows="3" placeholder="Des précisions sur votre commande..."></textarea>
            </div>
            
            <div class="form-actions">
                <button type="button" class="cancel-btn" onclick="hideOrderForm()">Annuler</button>
                <button type="submit" class="submit-btn">Envoyer la commande</button>
            </div>
        </form>
    </div>
</div>

<style>
.order-form-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
}

.order-form-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
}

.order-form-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    border-radius: 15px;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.order-form-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 2px solid #ffe0e0;
}

.order-form-header h2 {
    color: #ff6b6b;
    font-size: 24px;
    margin: 0;
}

.close-btn {
    background: none;
    border: none;
    font-size: 28px;
    color: #999;
    cursor: pointer;
    padding: 0;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.3s;
}

.close-btn:hover {
    background: #ffe0e0;
    color: #ff6b6b;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #ffe0e0;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Georgia', serif;
    transition: all 0.3s;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #ff6b6b;
    box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
}

.form-group textarea {
    resize: vertical;
    min-height: 80px;
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.cancel-btn,
.submit-btn {
    flex: 1;
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: 'Georgia', serif;
}

.cancel-btn {
    background: #f5f5f5;
    color: #666;
}

.cancel-btn:hover {
    background: #e0e0e0;
}

.submit-btn {
    background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
    color: white;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
}

@media (max-width: 768px) {
    .order-form-content {
        width: 95%;
        padding: 20px;
    }
    
    .form-actions {
        flex-direction: column;
    }
    
    .cancel-btn,
    .submit-btn {
        width: 100%;
    }
}
</style>

<script>
function showOrderForm(dishName) {
    document.getElementById('selectedDish').value = dishName;
    document.getElementById('orderForm').style.display = 'block';
    document.body.style.overflow = 'hidden';
}

function hideOrderForm() {
    document.getElementById('orderForm').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function handleOrderSubmit(event) {
    event.preventDefault();
    
    const formData = {
        customerName: document.getElementById('customerName').value,
        customerPhone: document.getElementById('customerPhone').value,
        selectedDish: document.getElementById('selectedDish').value,
        quantity: document.getElementById('quantity').value,
        deliveryLocation: document.getElementById('deliveryLocation').value,
        deliveryTime: document.getElementById('deliveryTime').value,
        additionalMessage: document.getElementById('additionalMessage').value
    };
    
    alert('Commande envoyée avec succès !\n\nDétails de la commande:\n' +
          'Plat: ' + formData.selectedDish + '\n' +
          'Quantité: ' + formData.quantity + '\n' +
          'Client: ' + formData.customerName + '\n' +
          'Téléphone: ' + formData.customerPhone + '\n' +
          'Lieu de livraison: ' + formData.deliveryLocation + '\n' +
          'Heure de livraison: ' + formData.deliveryTime);
    
    hideOrderForm();
    document.getElementById('orderFormElement').reset();
}
</script>
